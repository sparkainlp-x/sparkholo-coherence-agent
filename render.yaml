services:
  - type: web
    name: sparkholo-coherence-agent
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: NEBIUS_API_KEY
        sync: false
      - key: NEMOTRON_MODEL
        sync: false
